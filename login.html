<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Login - E-Learn</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(45deg, #6c5ce7, #0984e3); overflow: hidden;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px);
            padding: 40px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2);
            width: 400px; text-align: center; color: white; animation: fadeIn 0.8s ease-out;
        }
        .input-group input {
            width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 25px; border: none; outline: none;
        }
        .login-btn {
            width: 100%; padding: 12px; border-radius: 25px; border: none; background: #fab1a0;
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .login-btn:hover { transform: translateY(-3px); background: #ff7675; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="login-container">
        <form id="loginForm">
            <h2>Login</h2>
            <p style="margin-bottom: 20px;">Welcome To E-Learn</p>
            <div class="input-group">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
            <p id="error" style="color: #ff7675; margin-top: 10px; display: none;"></p>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
